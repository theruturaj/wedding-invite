<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <filter id="relief" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="4" stitchTiles="stitch"/>
    <feDiffuseLighting lighting-color="#ffffff" surfaceScale="1.6" diffuseConstant="1.05">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.2" intercept="0.82"/>
      <feFuncG type="linear" slope="0.2" intercept="0.82"/>
      <feFuncB type="linear" slope="0.2" intercept="0.82"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#relief)"/>
</svg>
